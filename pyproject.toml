[project]
name = "fmdf"
version = "0.1.0"
description = "JAX/Flax multi-task fine-tuning and evaluation system for driving-log sequences"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.25",
    "jaxlib>=0.4.25",
    "flax>=0.8.2",
    "optax>=0.2.1",
    "orbax-checkpoint>=0.5.8",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scikit-learn>=1.4.1",
    "matplotlib>=3.8.3",
    "duckdb>=0.10.0",
    "pyyaml>=6.0.1",
    "pyarrow>=15.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.2"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
